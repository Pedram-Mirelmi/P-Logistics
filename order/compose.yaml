services:
  postgres-order:
    image: postgres:17
    # max_prepared_transactions: off (0) by default - the Step 05 2PC lab
    # (TwoPhaseCommitLabTest) needs PREPARE TRANSACTION enabled here.
    command: postgres -c max_prepared_transactions=10
    environment:
      POSTGRES_DB: order
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
    ports:
      - 5433:5432
    volumes:
      - postgres-order-data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U order -d order" ]
      interval: 5s
      timeout: 3s
      retries: 10

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-order:5432/order
      SPRING_DATASOURCE_USERNAME: order
      SPRING_DATASOURCE_PASSWORD: order
      INVENTORY_SERVICE_URL: http://inventory-service:8081
      INTERNAL_API_KEY: dev-only-internal-key
      SECURITY_DEMOUSERS_CUSTOMER_USERNAME: order-client
      SECURITY_DEMOUSERS_CUSTOMER_PASSWORD: order-client-secret
      SECURITY_DEMOUSERS_OPERATOR_USERNAME: operator
      SECURITY_DEMOUSERS_OPERATOR_PASSWORD: operator-secret
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres-order:
          condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5

volumes:
  postgres-order-data: