spring.datasource.url=jdbc:postgresql://localhost:5433/order
spring.datasource.username=order
spring.datasource.password=order
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=3000

# Flyway owns the schema; Hibernate only validates the entity mapping against
# it at startup instead of generating/altering DDL itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Baseline so Flyway can adopt a database that already has the Step 3 tables
# (created by the old schema.sql) without a schema_history table yet.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Step 05 (Chapter 5: RPC): base URL of the separately deployed Inventory
# service. Order no longer reaches inventory_item through a local
# repository/transaction - only through this HTTP boundary.
inventory.service.url=http://localhost:8081

# Step 06 security foundation (service identity): must match
# inventory-service's internal.api-key - see InventoryClient/InternalApiKeyFilter.
internal.api-key=dev-only-internal-key

# Step 06 security foundation (authentication + authorization): two demo
# users HTTP Basic checks against, one per role (see SecurityConfig) - a
# real deployment would use a real user store instead. CUSTOMER can submit
# and read orders/shipments; OPERATOR can additionally create shipments
# manually and update shipment status.
security.demo-users.customer.username=order-client
security.demo-users.customer.password=order-client-secret
security.demo-users.operator.username=operator
security.demo-users.operator.password=operator-secret

# Step 07 (Chapter 7: Message-Oriented Middleware): these already match
# Spring Boot's own defaults (guest/guest is RabbitMQ's default account) -
# listed explicitly so the broker connection isn't invisible config. See
# RabbitMqConfig, OutboxRelay, OrderAcceptedListener.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Health endpoint used by the container HEALTHCHECK / Compose healthcheck.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
