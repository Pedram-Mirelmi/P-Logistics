# Shared infrastructure plus every service's own compose.yaml, pulled in via
# `include` so a plain `docker compose up --build` here brings up the whole
# system - no need to chain `-f` flags by hand. rabbitmq is the one piece
# every service reaches by hostname, so it's defined directly in this file
# instead of being duplicated three times.
include:
  - order/compose.yaml
  - inventory/compose.yaml
  - shipment/compose.yaml

services:
  rabbitmq:
    # "-management" adds the web console (localhost:15672, guest/guest) that
    # shows queue depth, message rates, and the DLQ - Step 07's "monitoring
    # queue depth" requirement, with no application code needed for it.
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Cross-file depends_on: each service below is fully defined in its own
  # included compose.yaml - this only adds the extra ordering that spans
  # files, merged by Compose into what's already declared there.
  order-service:
    depends_on:
      inventory-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  inventory-service:
    depends_on:
      rabbitmq:
        condition: service_healthy

  shipment-service:
    depends_on:
      postgres-order:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
