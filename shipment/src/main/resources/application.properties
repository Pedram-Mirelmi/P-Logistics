server.port=8082

# shipment-service has no database of its own yet - the `shipment` table
# still lives in postgres-order (created by order-service's
# V3__order_shipment_schema.sql), from before shipment was split out into
# its own process. Pointed at the same database/credentials as order-service
# until that table gets its own migration and its own postgres-shipment.
spring.datasource.url=jdbc:postgresql://localhost:5433/order
spring.datasource.username=order
spring.datasource.password=order
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema; Hibernate only validates the entity mapping
# against it at startup instead of generating/altering DDL itself. This
# module ships no migrations of its own - Flyway just confirms the
# `shipment` table order-service already created still matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Step 07 (Chapter 7: Message-Oriented Middleware): consumes
# OrderAcceptedEvent off the queue order-service's outbox relay publishes to.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Health endpoint used by the container HEALTHCHECK / Compose healthcheck.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
