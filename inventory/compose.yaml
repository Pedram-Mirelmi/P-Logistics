services:
  postgres-inventory:
    image: postgres:17
    # max_prepared_transactions: off (0) by default - the Step 05 2PC lab
    # (TwoPhaseCommitLabTest) needs PREPARE TRANSACTION enabled here.
    command: postgres -c max_prepared_transactions=10
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5434:5432"
    volumes:
      - postgres-inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-inventory:5432/inventory
      SPRING_DATASOURCE_USERNAME: inventory
      SPRING_DATASOURCE_PASSWORD: inventory
      INTERNAL_API_KEY: dev-only-internal-key
    depends_on:
      postgres-inventory:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5

volumes:
  postgres-inventory-data:
