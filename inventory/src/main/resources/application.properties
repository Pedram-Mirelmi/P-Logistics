server.port=8081

# Step 06 security foundation (service identity): shared secret checked by
# InternalApiKeyFilter on every /inventory/** request. A real deployment
# would pull this from a secrets manager, not source control - fine as a
# plain value for a local learning project, same as the DB credentials below.
internal.api-key=dev-only-internal-key

spring.datasource.url=jdbc:postgresql://localhost:5434/inventory
spring.datasource.username=inventory
spring.datasource.password=inventory
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=3000

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.order_inserts=true

# Flyway owns the schema; Hibernate only validates the entity mapping against
# it at startup instead of generating/altering DDL itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Health endpoint used by the container HEALTHCHECK / Compose healthcheck.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
