server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5434/inventory
spring.datasource.username=inventory
spring.datasource.password=inventory
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=3000

# Flyway owns the schema; Hibernate only validates the entity mapping against
# it at startup instead of generating/altering DDL itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Health endpoint used by the container HEALTHCHECK / Compose healthcheck.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
