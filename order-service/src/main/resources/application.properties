spring.datasource.url=jdbc:postgresql://localhost:5433/logistics
spring.datasource.username=logistics
spring.datasource.password=logistics
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=3000

# Flyway owns the schema; Hibernate only validates the entity mapping against
# it at startup instead of generating/altering DDL itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Baseline so Flyway can adopt a database that already has the Step 3 tables
# (created by the old schema.sql) without a schema_history table yet.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Step 05 (Chapter 5: RPC): base URL of the separately deployed Inventory
# service. Order no longer reaches inventory_item through a local
# repository/transaction - only through this HTTP boundary.
inventory.service.url=http://localhost:8081

# Step 06 security foundation (service identity): must match
# inventory-service's internal.api-key - see InventoryClient/InternalApiKeyFilter.
internal.api-key=dev-only-internal-key

# Step 06 security foundation (authentication): the one demo user HTTP Basic
# checks against (see SecurityConfig). Spring Boot auto-configures this user
# from these two properties as soon as spring-boot-starter-security is on
# the classpath and no other UserDetailsService bean exists - a real
# deployment would use a real user store instead.
spring.security.user.name=order-client
spring.security.user.password=order-client-secret

# Health endpoint used by the container HEALTHCHECK / Compose healthcheck.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
