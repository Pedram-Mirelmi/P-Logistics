spring.datasource.url=jdbc:postgresql://localhost:5433/logistics
spring.datasource.username=logistics
spring.datasource.password=logistics
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=3000

# Flyway owns the schema; Hibernate only validates the entity mapping against
# it at startup instead of generating/altering DDL itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Baseline so Flyway can adopt a database that already has the Step 3 tables
# (created by the old schema.sql) without a schema_history table yet.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Main logistics DB
spring.datasource.primary.url=jdbc:postgresql://localhost:5433/logistics
spring.datasource.primary.username=logistics
spring.datasource.primary.password=logistics
spring.datasource.primary.driver-class-name=org.postgresql.Driver

# Supplier DB
spring.datasource.secondary.url=jdbc:postgresql://localhost:5434/supplier
spring.datasource.secondary.username=supplier
spring.datasource.secondary.password=supplier
spring.datasource.secondary.driver-class-name=org.postgresql.Driver

# Health endpoint used by the container HEALTHCHECK / Compose healthcheck.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never