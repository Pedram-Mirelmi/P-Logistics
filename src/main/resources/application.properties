spring.datasource.url=jdbc:postgresql://localhost:5433/logistics
spring.datasource.username=logistics
spring.datasource.password=logistics
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=3000

# Main logistics DB
spring.datasource.primary.url=jdbc:postgresql://localhost:5433/logistics
spring.datasource.primary.username=logistics
spring.datasource.primary.password=logistics
spring.datasource.primary.driver-class-name=org.postgresql.Driver

# Supplier DB
spring.datasource.secondary.url=jdbc:postgresql://localhost:5434/supplier
spring.datasource.secondary.username=supplier
spring.datasource.secondary.password=supplier
spring.datasource.secondary.driver-class-name=org.postgresql.Driver